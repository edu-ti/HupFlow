services:
  # ---------------------------------------------------------------------------
  # 1. HupFlow Web Application (Next.js 15 Standalone)
  # ---------------------------------------------------------------------------
  hupflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hupflow-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://hupflow:hupflow_secret@hupflow-postgres:5432/hupflow_db
      - REDIS_URL=redis://hupflow-redis:6379
      - BETTER_AUTH_SECRET=hupflow_super_secret_jwt_key_2026_enterprise
      - BETTER_AUTH_URL=http://localhost:3000
      - STORAGE_ENDPOINT=http://hupflow-minio:9000
      - STORAGE_ACCESS_KEY=hupflow_minio_admin
      - STORAGE_SECRET_KEY=hupflow_minio_secret_key_2026
      - STORAGE_BUCKET=hupflow-media
    depends_on:
      hupflow-postgres:
        condition: service_healthy
      hupflow-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---------------------------------------------------------------------------
  # 2. PostgreSQL 16 Database
  # ---------------------------------------------------------------------------
  hupflow-postgres:
    image: postgres:16-alpine
    container_name: hupflow-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: hupflow
      POSTGRES_PASSWORD: hupflow_secret
      POSTGRES_DB: hupflow_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hupflow -d hupflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Redis 7 Alpine (Cache, Locks & Scheduling Queue)
  # ---------------------------------------------------------------------------
  hupflow-redis:
    image: redis:7-alpine
    container_name: hupflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 4. MinIO (Local S3 / Cloudflare R2 Offline Simulator)
  # ---------------------------------------------------------------------------
  hupflow-minio:
    image: minio/minio:latest
    container_name: hupflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: hupflow_minio_admin
      MINIO_ROOT_PASSWORD: hupflow_minio_secret_key_2026
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  minio_data:
